services:
  postgres:
    image: postgres:16-alpine
    container_name: saas_starter_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saas_starter}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-saas_starter}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  redis:
    image: redis:7-alpine
    container_name: saas_starter_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  backend:
    image: golang:1.23-alpine
    container_name: saas_starter_backend
    working_dir: /app
    command: sh -c "apk add --no-cache ffmpeg >/dev/null && export PATH=$PATH:/usr/local/go/bin; go mod download 2>/dev/null || true; go run ./cmd/api"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: ${APP_PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/saas_starter?sslmode=disable}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      JWT_REFRESH_TTL_HOURS: ${JWT_REFRESH_TTL_HOURS:-168}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
    ports:
      - "8080:8080"
    volumes:
      - ./backend-api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_net

  frontend-owner:
    image: node:22-alpine
    container_name: saas_starter_frontend_owner
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      VITE_DEV_SERVER_HOST: 0.0.0.0
      VITE_DEV_SERVER_PORT: 5173
      VITE_HMR_HOST: ${VITE_HMR_HOST:-}
      VITE_HMR_PORT: ${VITE_OWNER_HMR_PORT:-5173}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-owner:/app
      - frontend_owner_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - app_net

  frontend-tenant:
    image: node:22-alpine
    container_name: saas_starter_frontend_tenant
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      VITE_TENANT_HEADER: ${VITE_TENANT_HEADER:-X-Tenant-ID}
      VITE_DEV_SERVER_HOST: 0.0.0.0
      VITE_DEV_SERVER_PORT: 5174
      VITE_HMR_HOST: ${VITE_HMR_HOST:-}
      VITE_HMR_PORT: ${VITE_TENANT_HMR_PORT:-5174}
    ports:
      - "5174:5174"
    volumes:
      - ./frontend-tenant:/app
      - frontend_tenant_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - app_net

volumes:
  postgres_data:
  redis_data:
  frontend_owner_node_modules:
  frontend_tenant_node_modules:

networks:
  app_net:
    driver: bridge
